name: Sable
on: [push, pull_request]
permissions:
  contents: read
jobs:
  check:
    strategy:
      matrix:
        os: [ubuntu-24.04, macos-15]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust
        run: |
          rustup toolchain install 1.93.1 --profile minimal --component clippy,rustfmt
          rustup override set 1.93.1
      - name: Check
        run: |
          cargo fmt --all -- --check
          cargo clippy --all-targets -- -D warnings
          cargo test --release --locked
      - name: Rebuild original Mach-O fixtures on Linux
        if: runner.os == 'Linux'
        run: |
          bash scripts/build-fixtures.sh
          cmp artifacts/hello.macho modules/sable/fixtures/bin/hello.macho
          cmp artifacts/compute.macho modules/sable/fixtures/bin/compute.macho
          cmp artifacts/checksum.macho modules/sable/fixtures/bin/checksum.macho
          target/release/sable run artifacts/workload.macho jit > artifacts/rebuilt-checksum.bin
          python3 -c 'from pathlib import Path; assert Path("artifacts/rebuilt-checksum.bin").read_bytes() == (0x8e65b49356b423fa).to_bytes(8,"little")'
      - name: Independent ARM64 oracle
        run: |
          python3 -m venv artifacts/oracle-venv
          artifacts/oracle-venv/bin/pip -q install unicorn==2.1.4
          cargo build --release --example oracle_batch
          artifacts/oracle-venv/bin/python scripts/oracle.py --output artifacts/oracle-interp.json
          if [ "$RUNNER_OS" = Linux ]; then
            artifacts/oracle-venv/bin/python scripts/oracle.py --engine jit --output artifacts/oracle-jit.json
          fi
      - name: Rebuild and execute original dynamic libraries
        run: bash scripts/check-dynamic.sh
      - name: Rebuild and execute original chained fixups
        run: bash scripts/check-chained.sh
      - name: Rebuild and execute image initializers
        run: bash scripts/check-initializers.sh
      - name: Rebuild and execute scalar thread-local variables
        run: bash scripts/check-tls.sh
      - name: Rebuild and execute absolute/compact Objective-C dispatch
        run: bash scripts/check-objc.sh
      - name: Rebuild and execute static protocol introspection
        run: bash scripts/check-protocols.sh
      - name: Rebuild and execute checked superclass and Super2 calls
        run: bash scripts/check-super.sh
      - name: Rebuild and execute guest instances and pointer methods
        run: bash scripts/check-instances.sh
      - name: Rebuild and execute Q payload fields and void setters
        run: bash scripts/check-payload.sh
      - name: Rebuild and execute original framework constant strings
        run: bash scripts/check-strings.sh
      - name: Rebuild and execute ordinary ARC ownership and guest ASCII uppercase
        run: bash scripts/check-ownership.sh
      - name: Check app oracle scripts and inventory graphics exposure
        run: |
          python3 -m py_compile scripts/apple-app-check.py scripts/graphics-inventory.py scripts/aws-smoke.py scripts/firecracker-bench.py
          bash -n scripts/firecracker-workload.sh
          python3 scripts/check-firecracker-supervisor.py
          python3 scripts/density-report.py
          python3 scripts/graphics-inventory.py --output artifacts/graphics-inventory.json
